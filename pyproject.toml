[project]
name = "invoice-exception-agent"
version = "0.1.0"
description = "LangGraph pipeline that extracts, validates, matches and routes supplier invoices"
readme = "README.md"
authors = [
    { name = "Abhigyan Dey", email = "abhigyandey2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "streamlit>=1.38",
    "chromadb>=0.5",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
